# .github/workflows/deploy.yml

name: Build and Deploy Docs & Widget

on:
  push:
    branches: [wb-updates, main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      
      - name: Build Vite Widget (Library Mode)
        env:
          VITE_CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          VITE_CF_ACCESS_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          cd web
          npm ci
          npm run build
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install Python & Sphinx Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
          pip install -e .

      - name: Build Sphinx html
        run: |
          cd docs
          make html

      - name: Upload artifact to Github pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Github pages
        uses: actions/deploy-pages@v4